{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "thala.serviceAccountName" . }}
  labels:
    {{- include "thala.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.worker.serviceAccountName | quote }}
  labels:
    {{- include "thala.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
automountServiceAccountToken: {{ .Values.worker.automountServiceAccountToken }}
{{- end }}
