{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "thala.fullname" . }}-pod-runner
  labels:
    {{- include "thala.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "thala.fullname" . }}-pod-runner
  labels:
    {{- include "thala.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "thala.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "thala.fullname" . }}-pod-runner
{{- end }}
