apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "thala.fullname" . }}
  labels:
    {{- include "thala.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "thala.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "thala.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "thala.serviceAccountName" . }}
      containers:
        - name: thala
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--workflow", "/etc/thala/WORKFLOW.md", "run"]
          env:
            - name: THALA_K8S_WORKER_IMAGE
              value: {{ .Values.worker.image | quote }}
            - name: THALA_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: THALA_K8S_SERVICE_ACCOUNT
              value: {{ .Values.worker.serviceAccountName | quote }}
            - name: THALA_K8S_IMAGE_PULL_POLICY
              value: {{ .Values.worker.imagePullPolicy | quote }}
            - name: THALA_K8S_WORKER_AUTOMOUNT_TOKEN
              value: {{ .Values.worker.automountServiceAccountToken | quote }}
            - name: THALA_K8S_TERMINATION_GRACE_SECONDS
              value: {{ .Values.worker.terminationGraceSeconds | quote }}
            - name: THALA_K8S_SECRET_ENV
              value: {{ include "thala.workerSecretEnv" . | quote }}
            {{- if .Values.githubToken.existingSecret }}
            - name: THALA_K8S_GITHUB_TOKEN_SECRET
              value: "{{ .Values.githubToken.existingSecret }}:{{ .Values.githubToken.key }}"
            - name: THALA_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.githubToken.existingSecret | quote }}
                  key: {{ .Values.githubToken.key | quote }}
            {{- end }}
            {{- range .Values.extraEnv }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
          volumeMounts:
            - name: workflow
              mountPath: /etc/thala
              readOnly: true
            - name: workspace
              mountPath: /workspace
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: workflow
          configMap:
            name: {{ include "thala.fullname" . }}-workflow
        - name: workspace
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-workspace" (include "thala.fullname" .)) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
